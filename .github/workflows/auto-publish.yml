name: Auto Publish + SEO Optimize

on:
  # Daily at 6:00 AM UTC — full content + SEO pipeline
  schedule:
    - cron: '0 6 * * *'
    # 1st of every month at 7:00 AM UTC — adds review refresh
    - cron: '0 7 1 * *'
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # ═══════════════════════════════════════════════════════════
      # SETUP
      # ═══════════════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # ═══════════════════════════════════════════════════════════
      # STEP 1 — Scrape new listings from OpenStreetMap (free)
      # ═══════════════════════════════════════════════════════════
      - name: Scrape OSM for Listings
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/scrape-osm.mjs

      # ═══════════════════════════════════════════════════════════
      # STEP 1b — Sync live Google Maps listings via SerpApi (free tier)
      # Budget-aware: 100 free searches/month, no credit card required.
      # Writes to data/listings-pool.json; import step below upserts to MySQL.
      # ═══════════════════════════════════════════════════════════
      - name: Sync Google Maps Listings (SerpApi)
        timeout-minutes: 15
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/sync-serpapi-listings.mjs --budget=240 --limit=8

      # ═══════════════════════════════════════════════════════════
      # STEP 2 — Generate new blog posts via AI (Groq)
      # ═══════════════════════════════════════════════════════════
      - name: Generate Blog Posts
        timeout-minutes: 10
        continue-on-error: true
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/generate-blog-posts.mjs --limit=10 --delay=8000

      # ═══════════════════════════════════════════════════════════
      # STEP 3 — Import new listings into MySQL
      # ═══════════════════════════════════════════════════════════
      - name: Import Listings
        timeout-minutes: 5
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/import-listings.mjs --limit=50

      # ═══════════════════════════════════════════════════════════
      # STEP 4 — SEO DOCTOR: PRE-BUILD
      # Updates MySQL + writes config/pruned-pages.json and
      # config/related-providers.json that Astro reads at build time
      # ═══════════════════════════════════════════════════════════
      - name: SEO Doctor (pre-build)
        timeout-minutes: 12
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run seo:pre

      # ═══════════════════════════════════════════════════════════
      # STEP 5 — Build Astro site
      # ═══════════════════════════════════════════════════════════
      - name: Build Astro Site
        timeout-minutes: 10
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: npm run build

      # ═══════════════════════════════════════════════════════════
      # STEP 6 — SEO DOCTOR: POST-BUILD
      # Writes dist/sitemap.xml and dist/robots.txt
      # (Must run AFTER build so they aren't wiped)
      # ═══════════════════════════════════════════════════════════
      - name: SEO Doctor (post-build)
        timeout-minutes: 3
        run: npm run seo:post

      # ═══════════════════════════════════════════════════════════
      # STEP 7 — Deploy to Cloudflare Pages
      # ═══════════════════════════════════════════════════════════
      - name: Deploy to Cloudflare Pages
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=dogscarefinder --branch=main --commit-dirty=true

      # ═══════════════════════════════════════════════════════════
      # STEP 8 — Commit updated pool + configs + reports
      # ═══════════════════════════════════════════════════════════
      - name: Commit Updated Files
        timeout-minutes: 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ config/ reports/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-optimize: listings pool + configs + reports [skip ci]"
          git push || true

      # ═══════════════════════════════════════════════════════════
      # STEP 9b — MONTHLY ONLY: clean dead website URLs
      # Only runs when the cron trigger is the 1st-of-month one
      # ═══════════════════════════════════════════════════════════
      - name: Clean Dead Websites (Monthly)
        if: github.event.schedule == '0 7 1 * *'
        timeout-minutes: 30
        continue-on-error: true
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/clean-dead-websites.mjs --limit=1000

      # ═══════════════════════════════════════════════════════════
      # STEP 9c — MONTHLY ONLY: refresh Google reviews
      # Only runs when the cron trigger is the 1st-of-month one
      # ═══════════════════════════════════════════════════════════
      - name: Update Google Reviews (Monthly)
        if: github.event.schedule == '0 7 1 * *'
        timeout-minutes: 30
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/update-reviews.mjs