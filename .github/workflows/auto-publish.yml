name: Auto Publish Content

on:
  schedule:
    - cron: '0 6 * * *'      # Daily: scrape + generate blog posts + deploy
    - cron: '0 7 1 * *'      # 1st of every month: refresh Google reviews
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # ═══════════════════════════════════════════════════════════
      # SCRAPE — Google Places API (with website validation)
      # ═══════════════════════════════════════════════════════════
      - name: Scrape Google Places for Listings
        timeout-minutes: 15
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/scrape-google-places.mjs

      # ═══════════════════════════════════════════════════════════
      # BLOG — Generate posts via AI
      # ═══════════════════════════════════════════════════════════
      - name: Generate Blog Posts
        timeout-minutes: 10
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/generate-blog-posts.mjs --limit=10 --delay=8000

      # ═══════════════════════════════════════════════════════════
      # IMPORT — Listings pool → MySQL
      # ═══════════════════════════════════════════════════════════
      - name: Import Listings
        timeout-minutes: 5
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/import-listings.mjs --limit=50

      # ═══════════════════════════════════════════════════════════
      # BUILD — Astro SSG
      # ═══════════════════════════════════════════════════════════
      - name: Build Astro Site
        timeout-minutes: 10
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: npm run build

      # ═══════════════════════════════════════════════════════════
      # DEPLOY — Cloudflare Pages
      # ═══════════════════════════════════════════════════════════
      - name: Deploy to Cloudflare Pages
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=dogscarefinder --branch=main

      # ═══════════════════════════════════════════════════════════
      # COMMIT — Persist pool + progress
      # ═══════════════════════════════════════════════════════════
      - name: Commit Updated Pool
        timeout-minutes: 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings-pool.json data/gplaces-progress.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update listings pool [skip ci]"
          git push || true

      # ═══════════════════════════════════════════════════════════
      # MONTHLY — Refresh Google reviews for all listings
      # ═══════════════════════════════════════════════════════════
      - name: Update Google Reviews (Monthly)
        if: github.event.schedule == '0 7 1 * *'
        timeout-minutes: 30
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
        run: node scripts/update-reviews.mjs